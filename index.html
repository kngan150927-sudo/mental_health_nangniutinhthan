<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindfulLife - Sức khỏe tinh thần</title>
    
    <!-- 1. Tải Tailwind CSS để trang trí giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Tải React và ReactDOM (Phiên bản cụ thể 18.2.0 để ổn định) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js" crossorigin></script>
    
    <!-- 3. QUAN TRỌNG: Tải Prop-types (Sửa lỗi Recharts bị thiếu dependency) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

    <!-- 4. Tải Recharts (Phiên bản 2.12.0 ổn định) -->
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <!-- 5. Tải Babel để trình duyệt hiểu được mã React (JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font chữ -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap');
        body { font-family: 'Roboto', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#FAFAFA] text-[#333]">

    <!-- Nơi React sẽ hiển thị ứng dụng -->
    <div id="root"></div>

    <!-- Mã nguồn ứng dụng -->
    <script type="text/babel">
        // Lấy các hàm từ thư viện React và Recharts đã tải ở trên (Sử dụng window để đảm bảo an toàn)
        const { useState, useEffect, useRef } = window.React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts || {};

        // --- ĐỊNH NGHĨA ICON (Thay thế lucide-react để chạy trực tiếp không cần cài đặt) ---
        // Sử dụng React.Fragment (<>...</>) để gom nhóm các path
        const IconBase = ({ d, color = "currentColor", size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {d}
            </svg>
        );

        const Sun = (props) => <IconBase {...props} d={<><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></>} />;
        const Moon = (props) => <IconBase {...props} d={<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>} />;
        const Home = (props) => <IconBase {...props} d={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />;
        const BarChart2 = (props) => <IconBase {...props} d={<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>} />;
        const BookOpen = (props) => <IconBase {...props} d={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />;
        const MessageCircle = (props) => <IconBase {...props} d={<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>} />;
        const Smile = (props) => <IconBase {...props} d={<><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></>} />;
        const Meh = (props) => <IconBase {...props} d={<><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></>} />;
        const Frown = (props) => <IconBase {...props} d={<><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></>} />;
        const Send = (props) => <IconBase {...props} d={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />;
        const CheckCircle = (props) => <IconBase {...props} d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />;
        const Menu = (props) => <IconBase {...props} d={<><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>} />;
        const X = (props) => <IconBase {...props} d={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />;
        const Award = (props) => <IconBase {...props} d={<><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>} />;

        // --- CẤU HÌNH & DỮ LIỆU ---
        const THEME = {
            colors: {
                blue: '#A7C7E7',
                green: '#C8E6C9',
                gray: '#F5F5F5',
                purple: '#D1C4E9'
            },
            fonts: {
                heading: 'Poppins, sans-serif',
                body: 'Roboto, sans-serif'
            }
        };

        const SURVEY_QUESTIONS = [
            { id: 1, text: "Hôm nay bạn cảm thấy mức độ căng thẳng như thế nào?", label: "Căng thẳng" },
            { id: 2, text: "Bạn có cảm thấy được kết nối và thấu hiểu bởi mọi người không?", label: "Kết nối" },
            { id: 3, text: "Mức năng lượng tinh thần của bạn hôm nay thế nào?", label: "Năng lượng" },
            { id: 4, text: "Bạn có cảm thấy kiểm soát được cảm xúc của mình không?", label: "Kiểm soát" },
            { id: 5, text: "Bạn có cảm thấy hài lòng với bản thân và cuộc sống hiện tại?", label: "Hài lòng" }
        ];

        const MICRO_RETREATS = {
            low: [
                "🧘 Thở bụng sâu trong 3 phút.",
                "🍵 Pha một tách trà ấm và không làm gì cả.",
                "🌳 Đi dạo ngắn 10 phút dưới tán cây."
            ],
            medium: [
                "📖 Đọc 5 trang sách yêu thích.",
                "✍️ Viết ra 3 điều bạn biết ơn hôm nay.",
                "🧹 Dọn dẹp một góc nhỏ trên bàn làm việc."
            ],
            high: [
                "🌟 Chia sẻ năng lượng tích cực với một người bạn.",
                "🎨 Vẽ hoặc sáng tạo một cái gì đó nhỏ.",
                "🎯 Lên kế hoạch cho một mục tiêu mới."
            ]
        };

        // --- CÁC COMPONENTS ---

        // 1. HEADER
        const Header = ({ activeTab, setActiveTab, user }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const NavItem = ({ name, id, icon: Icon }) => (
                <button
                    onClick={() => { setActiveTab(id); setIsMenuOpen(false); }}
                    className={`flex items-center space-x-2 px-4 py-2 rounded-full transition-all duration-300 ${
                        activeTab === id 
                        ? 'bg-[#A7C7E7] text-white shadow-md font-medium' 
                        : 'text-gray-600 hover:bg-[#F5F5F5]'
                    }`}
                >
                    <Icon size={18} />
                    <span>{name}</span>
                </button>
            );

            return (
                <header className="bg-white shadow-sm sticky top-0 z-50">
                    <div className="container mx-auto px-4 py-4 flex justify-between items-center">
                        <div 
                            className="flex items-center space-x-2 cursor-pointer"
                            onClick={() => setActiveTab('home')}
                        >
                            <div className="w-10 h-10 bg-[#C8E6C9] rounded-full flex items-center justify-center text-white shadow-inner">
                                <Sun size={24} />
                            </div>
                            <span className="text-xl font-bold text-gray-800 tracking-tight" style={{ fontFamily: THEME.fonts.heading }}>
                                Mindful<span className="text-[#A7C7E7]">Life</span>
                            </span>
                        </div>

                        <nav className="hidden md:flex space-x-2">
                            <NavItem name="Trang chủ" id="home" icon={Home} />
                            <NavItem name="Dashboard" id="dashboard" icon={BarChart2} />
                            <NavItem name="Nhật ký" id="journal" icon={BookOpen} />
                            <NavItem name="Cộng đồng" id="community" icon={MessageCircle} />
                        </nav>

                        <div className="hidden md:flex items-center space-x-4">
                            <div className="flex items-center bg-[#F5F5F5] px-3 py-1 rounded-full text-sm font-medium text-gray-600 border border-gray-200">
                                <Award size={16} className="text-orange-400 mr-2" />
                                <span className="mr-1">Streak:</span>
                                <span className="text-orange-500 font-bold">{user.streak} ngày</span>
                            </div>
                            <div className="w-8 h-8 rounded-full bg-[#D1C4E9] flex items-center justify-center text-white font-bold text-sm">
                                {user.name.charAt(0)}
                            </div>
                        </div>

                        <button className="md:hidden text-gray-600" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                            {isMenuOpen ? <X size={24} /> : <Menu size={24} />}
                        </button>
                    </div>

                    {isMenuOpen && (
                        <div className="md:hidden bg-white border-t border-gray-100 py-4 px-4 flex flex-col space-y-2 shadow-lg">
                            <NavItem name="Trang chủ" id="home" icon={Home} />
                            <NavItem name="Dashboard" id="dashboard" icon={BarChart2} />
                            <NavItem name="Nhật ký" id="journal" icon={BookOpen} />
                            <NavItem name="Cộng đồng" id="community" icon={MessageCircle} />
                        </div>
                    )}
                </header>
            );
        };

        // 2. HERO SECTION
        const Hero = ({ onStartSurvey }) => (
            <section className="bg-gradient-to-b from-[#F0F7FF] to-white py-16 px-4 text-center">
                <div className="max-w-3xl mx-auto animate-fade-in-up">
                    <h1 className="text-4xl md:text-5xl font-bold text-gray-800 mb-6 leading-tight" style={{ fontFamily: THEME.fonts.heading }}>
                        Lắng nghe tâm trí <br />
                        <span className="text-[#A7C7E7]">chữa lành từng ngày</span>
                    </h1>
                    <p className="text-gray-600 text-lg mb-8 max-w-2xl mx-auto">
                        Dành 2 phút mỗi ngày để hiểu rõ cảm xúc của bản thân, ghi lại hành trình và tìm lại sự cân bằng trong cuộc sống.
                    </p>
                    <button 
                        onClick={onStartSurvey}
                        className="bg-[#A7C7E7] hover:bg-[#96b8d9] text-white text-lg font-semibold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:-translate-y-1"
                    >
                        Bắt đầu khảo sát ngay
                    </button>
                    
                    <div className="mt-12 flex justify-center space-x-8 text-gray-400">
                        <div className="flex flex-col items-center">
                            <div className="w-12 h-12 bg-[#C8E6C9] rounded-full flex items-center justify-center text-white mb-2 opacity-80">
                                <Smile size={24} />
                            </div>
                            <span className="text-sm">Theo dõi</span>
                        </div>
                        <div className="flex flex-col items-center">
                            <div className="w-12 h-12 bg-[#D1C4E9] rounded-full flex items-center justify-center text-white mb-2 opacity-80">
                                <BookOpen size={24} />
                            </div>
                            <span className="text-sm">Nhật ký</span>
                        </div>
                        <div className="flex flex-col items-center">
                            <div className="w-12 h-12 bg-[#A7C7E7] rounded-full flex items-center justify-center text-white mb-2 opacity-80">
                                <MessageCircle size={24} />
                            </div>
                            <span className="text-sm">Kết nối</span>
                        </div>
                    </div>
                </div>
            </section>
        );

        // 3. SURVEY COMPONENT
        const Survey = ({ onComplete }) => {
            const [answers, setAnswers] = useState({});
            const [step, setStep] = useState(0);

            const handleAnswer = (score) => {
                const newAnswers = { ...answers, [SURVEY_QUESTIONS[step].id]: score };
                setAnswers(newAnswers);
                if (step < SURVEY_QUESTIONS.length - 1) {
                    setStep(step + 1);
                } else {
                    const total = Object.values(newAnswers).reduce((a, b) => a + b, 0);
                    onComplete(total);
                }
            };

            const progress = ((step + 1) / SURVEY_QUESTIONS.length) * 100;

            return (
                <div className="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-8 my-8 border border-gray-100">
                    <div className="w-full bg-gray-200 rounded-full h-2 mb-6">
                        <div className="bg-[#A7C7E7] h-2 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                    </div>

                    <h3 className="text-xl font-semibold text-center mb-8 text-gray-700">
                        {SURVEY_QUESTIONS[step].text}
                    </h3>

                    <div className="grid grid-cols-5 gap-2 md:gap-4 mb-8">
                        {[1, 2, 3, 4, 5].map((score) => (
                            <button
                                key={score}
                                onClick={() => handleAnswer(score)}
                                className="flex flex-col items-center p-3 rounded-lg hover:bg-[#F0F7FF] transition-colors border border-transparent hover:border-[#A7C7E7] group"
                            >
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center mb-2 font-bold transition-all
                                    ${score === 1 ? 'bg-red-100 text-red-500' : 
                                    score === 2 ? 'bg-orange-100 text-orange-500' :
                                    score === 3 ? 'bg-yellow-100 text-yellow-500' :
                                    score === 4 ? 'bg-green-100 text-green-500' : 'bg-blue-100 text-blue-500'}
                                `}>
                                    {score}
                                </div>
                                <span className="text-xs text-gray-400 group-hover:text-gray-600">
                                    {score === 1 ? 'Rất tệ' : score === 5 ? 'Tuyệt vời' : ''}
                                </span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // 4. JOURNAL COMPONENT
        const Journal = ({ journals, onAddJournal }) => {
            const [text, setText] = useState("");
            const [mood, setMood] = useState("neutral");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!text.trim()) return;
                onAddJournal({ text, mood, date: new Date().toISOString() });
                setText("");
            };

            const moods = [
                { id: 'happy', icon: Smile, color: 'text-green-500', bg: 'bg-green-100' },
                { id: 'neutral', icon: Meh, color: 'text-yellow-500', bg: 'bg-yellow-100' },
                { id: 'sad', icon: Frown, color: 'text-blue-500', bg: 'bg-blue-100' },
            ];

            return (
                <div className="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                        <h3 className="text-lg font-bold mb-4 text-gray-700">Viết nhật ký hôm nay</h3>
                        <form onSubmit={handleSubmit}>
                            <div className="flex space-x-2 mb-4 justify-center">
                                {moods.map((m) => (
                                    <button
                                        key={m.id}
                                        type="button"
                                        onClick={() => setMood(m.id)}
                                        className={`p-2 rounded-full transition-all ${mood === m.id ? `${m.bg} ring-2 ring-offset-1 ring-${m.color.split('-')[1]}-300` : 'hover:bg-gray-100'}`}
                                    >
                                        <m.icon className={m.color} size={28} />
                                    </button>
                                ))}
                            </div>
                            <textarea
                                className="w-full h-40 p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#A7C7E7] focus:border-transparent resize-none text-gray-600 text-sm mb-4"
                                placeholder="Bạn đang nghĩ gì thế?..."
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                            ></textarea>
                            <button 
                                type="submit"
                                className="w-full bg-[#D1C4E9] hover:bg-[#bfaee0] text-white py-2 rounded-xl font-medium transition-colors"
                            >
                                Lưu nhật ký
                            </button>
                        </form>
                    </div>

                    <div className="md:col-span-2 space-y-4">
                        <h3 className="text-lg font-bold text-gray-700 mb-2">Dòng cảm xúc</h3>
                        {journals.length === 0 ? (
                            <div className="text-center py-10 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">
                                Chưa có nhật ký nào. Hãy viết dòng đầu tiên nhé!
                            </div>
                        ) : (
                            journals.map((entry, idx) => (
                                <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-50 flex gap-4 transition-hover hover:shadow-md">
                                    <div className={`w-12 h-12 rounded-full flex-shrink-0 flex items-center justify-center 
                                        ${entry.mood === 'happy' ? 'bg-green-100 text-green-500' : 
                                        entry.mood === 'neutral' ? 'bg-yellow-100 text-yellow-500' : 'bg-blue-100 text-blue-500'}`}>
                                        {entry.mood === 'happy' ? <Smile size={24} /> : entry.mood === 'neutral' ? <Meh size={24} /> : <Frown size={24} />}
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-400 mb-1">{new Date(entry.date).toLocaleString('vi-VN')}</p>
                                        <p className="text-gray-700 leading-relaxed">{entry.text}</p>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        // 5. DASHBOARD & ANALYTICS
        const Dashboard = ({ surveys, user }) => {
            const chartData = surveys.map((s, index) => ({
                name: `Lần ${index + 1}`,
                score: s.score,
                date: new Date(s.date).toLocaleDateString()
            })).slice(-7);

            const getLastResult = () => {
                if (surveys.length === 0) return null;
                const last = surveys[surveys.length - 1];
                return {
                    score: last.score,
                    level: last.score < 12 ? 'Cần nghỉ ngơi' : last.score < 18 ? 'Ổn định' : 'Rất tốt',
                    suggestion: last.score < 12 ? MICRO_RETREATS.low : last.score < 18 ? MICRO_RETREATS.medium : MICRO_RETREATS.high
                };
            };

            const lastResult = getLastResult();

            return (
                <div className="max-w-5xl mx-auto p-4 space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-[#A7C7E7]">
                            <h4 className="text-gray-500 text-sm font-medium">Tổng số bài khảo sát</h4>
                            <p className="text-3xl font-bold text-gray-800 mt-2">{surveys.length}</p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-[#C8E6C9]">
                            <h4 className="text-gray-500 text-sm font-medium">Streak hiện tại</h4>
                            <div className="flex items-center mt-2">
                                <p className="text-3xl font-bold text-gray-800 mr-2">{user.streak}</p>
                                <span className="text-xs text-orange-500 bg-orange-100 px-2 py-1 rounded-full">Ngày liên tiếp 🔥</span>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-[#D1C4E9]">
                            <h4 className="text-gray-500 text-sm font-medium">Trạng thái gần nhất</h4>
                            <p className="text-3xl font-bold text-gray-800 mt-2">{lastResult ? lastResult.level : "Chưa có"}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm">
                            <h3 className="text-lg font-bold text-gray-700 mb-6">Biểu đồ sức khỏe tinh thần</h3>
                            <div className="h-64 w-full">
                                {surveys.length > 0 ? (
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={chartData}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                            <XAxis dataKey="name" tick={{fontSize: 12}} stroke="#999" axisLine={false} tickLine={false} />
                                            <YAxis domain={[0, 25]} hide />
                                            <Tooltip 
                                                contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)'}} 
                                                cursor={{stroke: '#A7C7E7', strokeWidth: 2}}
                                            />
                                            <Line 
                                                type="monotone" 
                                                dataKey="score" 
                                                stroke="#A7C7E7" 
                                                strokeWidth={3} 
                                                dot={{r: 4, fill: '#A7C7E7', strokeWidth: 2, stroke: '#fff'}} 
                                                activeDot={{r: 6}} 
                                            />
                                        </LineChart>
                                    </ResponsiveContainer>
                                ) : (
                                    <div className="h-full flex items-center justify-center text-gray-400 text-sm">
                                        Chưa có dữ liệu để hiển thị
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-[#F0FFF4] to-white p-6 rounded-2xl shadow-sm border border-[#C8E6C9]">
                            <div className="flex items-center mb-4">
                                <div className="p-2 bg-[#C8E6C9] rounded-full text-white mr-3">
                                    <Sun size={20} />
                                </div>
                                <h3 className="text-lg font-bold text-gray-800">Gợi ý Micro Retreat</h3>
                            </div>
                            
                            {lastResult ? (
                                <div>
                                    <p className="text-sm text-gray-600 mb-4 italic">Dựa trên kết quả khảo sát gần nhất của bạn:</p>
                                    <ul className="space-y-3">
                                        {lastResult.suggestion.map((item, idx) => (
                                            <li key={idx} className="flex items-start text-gray-700 bg-white p-3 rounded-lg shadow-sm">
                                                <CheckCircle size={16} className="text-[#C8E6C9] mt-1 mr-2 flex-shrink-0" />
                                                <span className="text-sm">{item}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ) : (
                                <div className="h-40 flex items-center justify-center text-center text-gray-500 text-sm">
                                    Hãy hoàn thành khảo sát đầu tiên để nhận gợi ý thư giãn được cá nhân hóa nhé!
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 6. COMMUNITY CHAT
        const Community = () => {
            const [messages, setMessages] = useState([
                { id: 1, user: "Minh An", text: "Chào mọi người, hôm nay mình đã thử đi bộ 10 phút, cảm thấy rất nhẹ nhõm!", tag: "Chia sẻ", color: "bg-blue-100" },
                { id: 2, user: "Lan Chi", text: "Tuyệt quá! Mình cũng vừa tập hít thở sâu xong.", tag: "Đồng cảm", color: "bg-green-100" }
            ]);
            const [input, setInput] = useState("");
            const chatEndRef = useRef(null);

            const sendMessage = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                setMessages([...messages, { 
                    id: Date.now(), 
                    user: "Tôi", 
                    text: input, 
                    tag: "Vừa xong",
                    color: "bg-[#A7C7E7] text-white" 
                }]);
                setInput("");
            };

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            return (
                <div className="max-w-2xl mx-auto h-[600px] flex flex-col bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden my-6">
                    <div className="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <h3 className="font-bold text-gray-700">Góc chia sẻ yên bình 🌿</h3>
                        <span className="text-xs bg-green-100 text-green-600 px-2 py-1 rounded-full">● 12 người online</span>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-[#FAFAFA]">
                        {messages.map((msg) => (
                            <div key={msg.id} className={`flex flex-col ${msg.user === "Tôi" ? "items-end" : "items-start"}`}>
                                <span className="text-xs text-gray-400 mb-1 ml-1">{msg.user}</span>
                                <div className={`max-w-[80%] p-3 rounded-2xl text-sm ${msg.user === "Tôi" ? "bg-[#A7C7E7] text-white rounded-tr-none" : "bg-white text-gray-700 shadow-sm border border-gray-100 rounded-tl-none"}`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        <div ref={chatEndRef} />
                    </div>

                    <form onSubmit={sendMessage} className="p-3 bg-white border-t border-gray-100 flex gap-2">
                        <input 
                            type="text" 
                            className="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-[#A7C7E7]"
                            placeholder="Gửi lời động viên..."
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                        />
                        <button type="submit" className="p-2 bg-[#A7C7E7] text-white rounded-full hover:bg-[#96b8d9] transition-colors">
                            <Send size={18} />
                        </button>
                    </form>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [showSurveyModal, setShowSurveyModal] = useState(false);
            
            const [user, setUser] = useState({ name: "Bạn", streak: 0, lastLogin: null });
            const [surveys, setSurveys] = useState([]);
            const [journals, setJournals] = useState([]);

            useEffect(() => {
                const savedUser = JSON.parse(localStorage.getItem('mh_user'));
                const savedSurveys = JSON.parse(localStorage.getItem('mh_surveys'));
                const savedJournals = JSON.parse(localStorage.getItem('mh_journals'));

                if (savedUser) setUser(savedUser);
                if (savedSurveys) setSurveys(savedSurveys);
                if (savedJournals) setJournals(savedJournals);

                const today = new Date().toLocaleDateString();
                if (savedUser && savedUser.lastLogin !== today) {
                    const updatedUser = { ...savedUser, lastLogin: today };
                    if (!savedUser.streak) updatedUser.streak = 1;
                    setUser(updatedUser);
                    localStorage.setItem('mh_user', JSON.stringify(updatedUser));
                }
            }, []);

            const handleSurveyComplete = (score) => {
                const newSurvey = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    score: score
                };
                const newSurveys = [...surveys, newSurvey];
                setSurveys(newSurveys);
                localStorage.setItem('mh_surveys', JSON.stringify(newSurveys));
                
                const newUser = { ...user, streak: user.streak + 1 };
                setUser(newUser);
                localStorage.setItem('mh_user', JSON.stringify(newUser));

                setShowSurveyModal(false);
                setActiveTab('dashboard');
            };

            const handleAddJournal = (entry) => {
                const newJournals = [entry, ...journals];
                setJournals(newJournals);
                localStorage.setItem('mh_journals', JSON.stringify(newJournals));
            };

            const renderContent = () => {
                switch(activeTab) {
                    case 'home': return <Hero onStartSurvey={() => setShowSurveyModal(true)} />;
                    case 'dashboard': return <Dashboard surveys={surveys} user={user} />;
                    case 'journal': return <Journal journals={journals} onAddJournal={handleAddJournal} />;
                    case 'community': return <Community />;
                    default: return <Hero onStartSurvey={() => setShowSurveyModal(true)} />;
                }
            };

            return (
                <div className="min-h-screen bg-[#FAFAFA] text-[#333] font-sans">
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} user={user} />
                    <main className="pb-12">{renderContent()}</main>
                    {showSurveyModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-w-lg relative animate-fade-in-up">
                                <button onClick={() => setShowSurveyModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                                    <X size={24} />
                                </button>
                                <div className="p-2"><Survey onComplete={handleSurveyComplete} /></div>
                            </div>
                        </div>
                    )}
                    <footer className="bg-white border-t border-gray-100 py-8 text-center text-gray-400 text-sm">
                        <p className="mb-2 font-medium">MindfulLife © 2024</p>
                        <div className="flex justify-center space-x-4">
                            <a href="#" className="hover:text-[#A7C7E7]">Chính sách</a>
                            <span>•</span>
                            <a href="#" className="hover:text-[#A7C7E7]">Hỗ trợ</a>
                            <span>•</span>
                            <span className="text-red-300">SOS: 115</span>
                        </div>
                    </footer>
                </div>
            );
        }

        // --- KHỞI CHẠY ỨNG DỤNG ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
